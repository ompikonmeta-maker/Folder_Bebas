name: CashFlow package

on:
  push:
    paths: ["cashflow/**", ".github/workflows/cashflow.yml"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashflow
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: CashFlow-windows
          path: cashflow/release/
